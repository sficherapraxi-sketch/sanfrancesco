<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Il sentiero di Francesco</title>
<style>
:root{--b:#002855;--g:#cce97f;--c:#eef1f8;--w:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--c);color:var(--b);line-height:1.45}header{position:sticky;top:0;z-index:5;background:var(--b);color:var(--w);padding:13px 18px}.head{max-width:880px;margin:auto;display:flex;justify-content:space-between;gap:12px}.progress{height:7px;background:var(--w);border-radius:9px;margin:9px auto 0;max-width:880px;overflow:hidden}.progress span{display:block;height:100%;background:var(--g);width:0}main{min-height:84vh;display:flex;align-items:center;justify-content:center;padding:24px 12px}.card{width:min(880px,100%);background:var(--w);border:2px solid var(--b);border-radius:18px;padding:clamp(20px,5vw,44px);box-shadow:0 10px 25px rgba(0,40,85,.12)}h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:.2em 0}h2{font-size:clamp(1.45rem,5vw,2rem);margin:.3em 0}.tag{font-size:.8rem;font-weight:bold;text-transform:uppercase}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{border:1px solid var(--b);background:var(--c);border-radius:20px;padding:6px 11px}.choices{display:grid;gap:12px;margin-top:22px}button{font:inherit;font-weight:bold;color:var(--b);border:2px solid var(--b);border-radius:12px;padding:14px 18px;cursor:pointer}.choice{text-align:left;background:var(--w);width:100%}.choice:hover,.choice.sel,.primary{background:var(--g)}.secondary{background:var(--w)}.feedback{display:none;margin-top:18px;padding:16px;background:var(--c);border-left:6px solid var(--g);border-radius:8px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.result{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.profile{background:var(--g);border:2px solid var(--b);border-radius:12px;padding:17px}.scores{display:grid;gap:8px;margin:18px 0}.row{display:grid;grid-template-columns:145px 1fr 28px;gap:8px;align-items:center;font-size:.9rem}.bar{height:10px;background:var(--c);border:1px solid var(--b);border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--g)}canvas{display:block;width:100%;max-width:600px;height:auto;margin:auto}.trainer{margin-top:22px;background:var(--c);border:2px dashed var(--b);border-radius:10px;padding:15px}@media(max-width:700px){header{position:static}.head{flex-direction:column;gap:2px}main{min-height:78vh;align-items:flex-start;padding:12px 8px}.card{padding:20px 14px}.choices{display:flex;flex-direction:column}.choice,.controls button{width:100%}.controls{flex-direction:column}.result{grid-template-columns:1fr}.row{grid-template-columns:110px 1fr 25px;font-size:.78rem}}
</style></head><body>
<header><div class="head"><strong>Il sentiero di Francesco</strong><span id="step">Benvenuto</span></div><div class="progress"><span id="prog"></span></div></header>
<main><section class="card" id="app" aria-live="polite"></section></main>
<script>
var dims={semplicita:'Semplicità',fraternita:'Aiuto agli altri',creato:'Cura della natura',coraggio:'Coraggio',pace:'Pace e dialogo'};
var questions=[
{title:'Lo zaino pesante',text:'Stai partendo per un cammino. Il tuo zaino è troppo pesante. Che cosa fai?',choices:[
{text:'Porto solo le cose davvero utili e regalo ciò che non mi serve.',points:{semplicita:2,fraternita:2,coraggio:1},feedback:'Ora cammini più leggero e puoi anche aiutare qualcuno.'},
{text:'Tengo tutto, perché potrebbe servirmi durante il viaggio.',points:{semplicita:1,coraggio:1},feedback:'Sei preparato, ma lo zaino rimane pesante.'},
{text:'Chiedo agli amici di scegliere insieme cosa portare.',points:{fraternita:2,pace:2,semplicita:1},feedback:'Decidere insieme rende il viaggio più facile per tutti.'}]},
{title:'Una persona ha bisogno',text:'Lungo la strada incontri una persona stanca che chiede aiuto. Il gruppo vuole andare avanti. Che cosa fai?',choices:[
{text:'Mi fermo, ascolto e cerco di capire di cosa ha bisogno.',points:{fraternita:2,pace:2,coraggio:1},feedback:'Ascoltare è già un modo importante per aiutare.'},
{text:'Le lascio qualcosa di utile e poi raggiungo il gruppo.',points:{fraternita:1,semplicita:1},feedback:'Hai dato un aiuto veloce e concreto.'},
{text:'Chiedo a tutto il gruppo di fermarsi e aiutare insieme.',points:{fraternita:2,pace:1,coraggio:2},feedback:'Quando si collabora, nessuno resta solo.'}]},
{title:'Il bosco sporco',text:'Nel bosco trovi cartacce e bottiglie vuote. Che cosa fai?',choices:[
{text:'Raccolgo alcuni rifiuti e invito gli altri a fare lo stesso.',points:{creato:2,coraggio:2,pace:1},feedback:'Il tuo esempio può convincere anche gli altri.'},
{text:'Avviso un adulto o chi si occupa del bosco.',points:{creato:2,coraggio:1},feedback:'Hai cercato l’aiuto di chi può pulire il luogo in sicurezza.'},
{text:'Propongo di fermarci per pulire insieme una parte del sentiero.',points:{creato:2,semplicita:1,fraternita:1,coraggio:1},feedback:'Hai scelto di dedicare tempo alla cura della natura.'}]},
{title:'Un litigio in piazza',text:'Due gruppi di bambini vogliono usare lo stesso spazio per giocare. Stanno litigando. Che cosa proponi?',choices:[
{text:'Ascolto tutti e cerco una soluzione che vada bene a entrambi.',points:{pace:3,fraternita:1,coraggio:1},feedback:'Ascoltare aiuta a trovare un accordo.'},
{text:'Dico quale soluzione mi sembra più giusta e spiego perché.',points:{coraggio:2,pace:1},feedback:'Hai espresso la tua idea con chiarezza.'},
{text:'Propongo di usare lo spazio a turno.',points:{pace:2,semplicita:1,fraternita:1},feedback:'Fare a turno permette a tutti di giocare.'}]},
{title:'La merenda da dividere',text:'La merenda non basta per tutti. Alcuni bambini hanno più fame. Che cosa fai?',choices:[
{text:'Do un po’ di più a chi ne ha più bisogno e spiego la scelta.',points:{fraternita:2,pace:1,coraggio:2},feedback:'Hai guardato i bisogni di ciascuno.'},
{text:'Divido tutto in parti uguali.',points:{pace:1,semplicita:2},feedback:'Hai scelto una regola semplice e uguale per tutti.'},
{text:'Prendo una parte piccola e invito gli altri a prendere solo ciò che serve.',points:{semplicita:2,fraternita:2,coraggio:1},feedback:'Hai dato il buon esempio e hai avuto fiducia negli altri.'}]},
{title:'Un piccolo impegno',text:'Il cammino è finito. Quale gesto vuoi fare nei prossimi giorni?',choices:[
{text:'Rinuncio a qualcosa che non mi serve e uso meglio il mio tempo.',points:{semplicita:3,coraggio:1},feedback:'Un piccolo gesto può diventare una buona abitudine.'},
{text:'Faccio il primo passo per fare pace con qualcuno.',points:{pace:2,coraggio:2,fraternita:1},feedback:'Fare pace richiede coraggio.'},
{text:'Aiuto a prendermi cura di un luogo e coinvolgo un amico.',points:{creato:2,fraternita:2,coraggio:1},feedback:'Prendersi cura della natura è ancora più bello insieme.'}]}
];
var profiles={semplicita:['Viandante semplice','Sai scegliere ciò che conta davvero e non hai bisogno di tante cose per stare bene.'],fraternita:['Amico di tutti','Ti piace aiutare, condividere e fare in modo che nessuno resti solo.'],creato:['Custode della natura','Noti ciò che accade intorno a te e vuoi proteggere gli animali, le piante e i luoghi.'],coraggio:['Amico coraggioso','Cerchi di fare la cosa giusta anche quando non è facile.'],pace:['Costruttore di pace','Sai ascoltare e cerchi soluzioni che aiutino le persone a ritrovarsi.']};
var current=0,answers=[],order=[],selected=-1;
var app=document.getElementById('app'),step=document.getElementById('step'),prog=document.getElementById('prog');
function up(){window.scrollTo(0,0)}
function shuffled(a){var copy=a.slice();for(var i=copy.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=copy[i];copy[i]=copy[j];copy[j]=t}return copy}
function intro(){current=0;answers=[];step.textContent='Benvenuto';prog.style.width='0%';app.innerHTML='<div class="tag">Gioco a scelte</div><h1>Il sentiero di Francesco</h1><p>Durante il cammino incontrerai sei piccole situazioni. Scegli quello che faresti tu. Non ci sono risposte sbagliate.</p><div class="chips"><span class="chip">6 domande</span><span class="chip">Per bambini</span><span class="chip">Profilo finale</span></div><button class="primary" onclick="startGame()">Inizia</button>';up()}
function startGame(){current=0;showQuestion()}
function showQuestion(){selected=-1;order=shuffled(questions[current].choices);step.textContent='Domanda '+(current+1)+' di '+questions.length;prog.style.width=(((current+1)/questions.length)*100)+'%';var q=questions[current];var buttons='';for(var i=0;i<order.length;i++)buttons+='<button class="choice" onclick="pick('+i+',this)">'+order[i].text+'</button>';app.innerHTML='<div class="tag">Domanda '+(current+1)+' di '+questions.length+'</div><h2>'+q.title+'</h2><p>'+q.text+'</p><div class="choices">'+buttons+'</div><div class="feedback" id="feedback"></div><div class="controls"><button class="secondary" onclick="goBack()" '+(current===0?'disabled':'')+'>Indietro</button><button class="primary" id="nextBtn" onclick="goNext()" disabled>'+(current===questions.length-1?'Vedi il mio profilo':'Avanti')+'</button></div>';up()}
function pick(i,button){selected=i;var bs=document.querySelectorAll('.choice');for(var k=0;k<bs.length;k++)bs[k].className='choice';button.className='choice sel';var f=document.getElementById('feedback');f.style.display='block';f.innerHTML='<strong>Cosa succede?</strong><br>'+order[i].feedback;document.getElementById('nextBtn').disabled=false}
function goNext(){if(selected<0)return;answers[current]=order[selected];if(current===questions.length-1){showResult();return}current++;showQuestion()}
function goBack(){if(current>0){current--;showQuestion()}}
function totals(){var s={semplicita:0,fraternita:0,creato:0,coraggio:0,pace:0};for(var i=0;i<answers.length;i++){if(!answers[i])continue;var p=answers[i].points;for(var k in p)s[k]+=p[k]}return s}
function showResult(){var s=totals(),leader='semplicita';for(var k in s)if(s[k]>s[leader])leader=k;var pr=profiles[leader];step.textContent='Il tuo profilo';prog.style.width='100%';var rows='';for(var d in dims)rows+='<div class="row"><span>'+dims[d]+'</span><div class="bar"><span style="width:'+Math.min(100,s[d]/12*100)+'%"></span></div><strong>'+s[d]+'</strong></div>';app.innerHTML='<div class="tag">Il tuo risultato</div><div class="result"><div><h1>'+pr[0]+'</h1><div class="profile">'+pr[1]+'</div><div class="scores">'+rows+'</div><p><strong>La tua piccola missione:</strong> scegli un gesto buono da fare questa settimana.</p></div><canvas id="radar" width="600" height="420"></canvas></div><div class="controls"><button class="secondary" onclick="intro()">Ricomincia</button><button class="primary" onclick="downloadResult()">Scarica il risultato</button></div>';up();setTimeout(function(){drawRadar(document.getElementById('radar'),s)},0)}
function drawRadar(c,s){if(!c||!c.getContext)return;var x=c.getContext('2d'),keys=Object.keys(dims),cx=300,cy=215,r=120,n=keys.length;x.fillStyle='#ffffff';x.fillRect(0,0,600,420);x.strokeStyle='#002855';x.fillStyle='#002855';x.textAlign='center';x.textBaseline='middle';x.font='10px Arial';for(var ring=1;ring<=4;ring++){x.beginPath();for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n,px=cx+Math.cos(a)*r*ring/4,py=cy+Math.sin(a)*r*ring/4;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke()}for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke();x.fillText(dims[keys[i]],cx+Math.cos(a)*(r+42),cy+Math.sin(a)*(r+42))}x.beginPath();for(var i=0;i<n;i++){var a=-Math.PI/2+i*2*Math.PI/n,rr=r*Math.min(12,s[keys[i]])/12,px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fillStyle='rgba(204,233,127,.75)';x.fill();x.strokeStyle='#002855';x.lineWidth=3;x.stroke()}
function downloadResult(){var src=document.getElementById('radar'),s=totals(),leader='semplicita';for(var k in s)if(s[k]>s[leader])leader=k;var c=document.createElement('canvas');c.width=900;c.height=650;var x=c.getContext('2d');x.fillStyle='#eef1f8';x.fillRect(0,0,900,650);x.fillStyle='#002855';x.textAlign='center';x.font='bold 38px Arial';x.fillText('Il sentiero di Francesco',450,55);x.font='bold 32px Arial';x.fillText(profiles[leader][0],450,105);if(src)x.drawImage(src,150,125,600,420);x.font='19px Arial';x.fillText('La mia missione: fare un gesto buono questa settimana.',450,600);var a=document.createElement('a');a.download='il-mio-profilo.png';a.href=c.toDataURL('image/png');a.click()}
intro();
</script></body></html>
